name: Test no matching pull requests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: peter-evans/rebase
          head: peter-evans:this-branch-does-not-exist-act-test-xyz
      - name: Assert success with no rebase performed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.rebased-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rebased-count: '$COUNT'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$COUNT" ]; then
            echo "FAIL: expected no rebased-count output when no PRs match"
            exit 1
          fi
          echo "PASS"
